<div class="relative min-h-screen overflow-clip" style="background: var(--color-bg)">

  <!-- Mobile backdrop -->
  <div *ngIf="mobileMenuOpen() && isMobile()"
       (click)="closeMobileMenu()"
       class="fixed inset-0 z-30 bg-slate-900/40 backdrop-blur-sm fade-in lg:hidden"></div>

  <!-- Sidebar -->
  <aside class="group/sidebar fz-side fixed inset-y-0 left-0 z-40 flex flex-col transition-[width,transform] duration-300 ease-in-out"
         [class.w-64]="!sidebarCollapsed() && !isMobile()"
         [class.w-16]="sidebarCollapsed() && !isMobile()"
         [class.w-72]="isMobile()"
         [class.translate-x-0]="!isMobile() || mobileMenuOpen()"
         [class.-translate-x-full]="isMobile() && !mobileMenuOpen()">

    <!-- Edge collapse toggle (desktop) -->
    <button type="button"
            (click)="toggleSidebar()"
            class="absolute -right-3 top-7 z-50 hidden h-6 w-6 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-500 opacity-0 shadow-md transition-all duration-200 hover:scale-110 hover:border-primary-500/40 hover:bg-brand-50 hover:text-primary-500 group-hover/sidebar:opacity-100 dark:border-white/10 dark:bg-slate-900 dark:text-slate-400 dark:hover:border-primary-500/40 dark:hover:bg-primary-500/10 dark:hover:text-primary-500 lg:flex"
            [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path *ngIf="!sidebarCollapsed()" d="M15 18l-6-6 6-6"></path>
        <path *ngIf="sidebarCollapsed()" d="M9 18l6-6-6-6"></path>
      </svg>
    </button>

    <!-- Brand -->
    <div class="flex h-16 items-center px-3" style="border-bottom: 1px solid var(--fz-nav-line)"
         [class.justify-center]="sidebarCollapsed() && !isMobile()">
      <a routerLink="/" class="flex items-center" title="Back to home" (click)="closeMobileMenu()">
        <app-fiscalize-logo [iconOnly]="sidebarCollapsed() && !isMobile()"></app-fiscalize-logo>
      </a>
    </div>

    <!-- Nav -->
    <nav class="flex-1 space-y-5 overflow-y-auto overflow-x-hidden px-3 py-4">
      <div *ngFor="let group of groups; let gi = index" class="space-y-1 fade-in-down"
           [style.animation-delay]="(0.05 + gi * 0.04) + 's'">
        <div *ngIf="!sidebarCollapsed() || isMobile()"
             class="fz-sec-lbl">
          {{ group.title }}
        </div>
        <ul class="space-y-0.5">
          <li *ngFor="let item of group.items" class="relative">
            <a [routerLink]="item.url"
               routerLinkActive="is-active"
               (click)="closeMobileMenu()"
               class="group/item fz-nav-row"
               [class.justify-center]="sidebarCollapsed() && !isMobile()">
              <svg class="fz-nav-ico h-5 w-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path [attr.d]="item.icon"></path>
              </svg>
              <span *ngIf="!sidebarCollapsed() || isMobile()" class="truncate">{{ item.title }}</span>

              <!-- Tooltip when collapsed (desktop) -->
              <span *ngIf="sidebarCollapsed() && !isMobile()"
                    class="pointer-events-none absolute left-full ml-3 whitespace-nowrap rounded-lg bg-slate-900 px-2.5 py-1.5 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity duration-200 group-hover/item:opacity-100 dark:bg-slate-100 dark:text-slate-900">
                {{ item.title }}
              </span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Footer -->
    <div class="px-3 py-3 text-[11px]" style="border-top: 1px solid var(--fz-nav-line); color: var(--fz-nav-fg-dim)">
      <a href="mailto:legal@fiscalize.co.zw?subject=Fiscalize%20for%20Xero%20support"
         class="group/item fz-nav-row relative" [class.justify-center]="sidebarCollapsed() && !isMobile()"
         title="Help &amp; support" data-testid="support-link">
        <svg class="fz-nav-ico h-5 w-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span *ngIf="!sidebarCollapsed() || isMobile()" class="truncate">Help &amp; support</span>
        <span *ngIf="sidebarCollapsed() && !isMobile()"
              class="pointer-events-none absolute left-full ml-3 whitespace-nowrap rounded-lg bg-slate-900 px-2.5 py-1.5 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity duration-200 group-hover/item:opacity-100 dark:bg-slate-100 dark:text-slate-900">
          Help &amp; support
        </span>
      </a>
      <div *ngIf="!sidebarCollapsed() || isMobile()" class="mt-2 px-3">
        Fiscalize · <a routerLink="/terms" class="hover:underline">Terms</a> · <a routerLink="/privacy" class="hover:underline">Privacy</a>
      </div>
    </div>
  </aside>

  <!-- Header -->
  <app-nav-bar [collapsed]="sidebarCollapsed()" (toggleSidebar)="toggleSidebar()"></app-nav-bar>

  <!-- Main content -->
  <main class="relative pt-16 transition-[padding] duration-300 ease-in-out"
        [class.lg:pl-64]="!sidebarCollapsed()"
        [class.lg:pl-16]="sidebarCollapsed()">
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
      <!-- The active company's Xero connection needs attention: say so on every page, not only under Settings. -->
      <div *ngIf="connectionProblem() as problem"
           class="mb-5 flex flex-col gap-3 rounded-2xl border border-amber-200 bg-amber-50/90 px-4 py-3 text-sm text-amber-900 shadow-sm fade-in-down sm:flex-row sm:items-center sm:justify-between dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-100"
           role="status">
        <div class="flex items-start gap-3">
          <svg class="mt-0.5 h-5 w-5 flex-shrink-0 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
          <div>
            <p class="font-semibold">Xero connection needs attention</p>
            <p class="mt-0.5 text-amber-800 dark:text-amber-200">{{ problem }}</p>
          </div>
        </div>
        <a routerLink="/xero-connection" (click)="closeMobileMenu()"
           class="inline-flex flex-shrink-0 items-center justify-center gap-1.5 rounded-xl bg-amber-500 px-3.5 py-2 text-xs font-semibold text-white shadow-sm transition hover:bg-amber-600 active:scale-95">
          Re-authorize
          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </a>
      </div>
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
